name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          # brel-xbrl has C extensions; pre-install build backends so pip
          # doesn't try (and fail) to fetch setuptools from a Nexus proxy
          # that doesn't carry it.
          pip install --no-cache-dir --upgrade setuptools wheel
          pip install --no-cache-dir --no-build-isolation -r requirements.txt pytest pytest-cov pytest-mock pylint
      - name: pytest with coverage
        run: |
          python3 -m pytest tests/ -q \
            --cov=src --cov-report=xml:coverage.xml --cov-config=.coveragerc \
            --junitxml=test-results.xml
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v5
      - name: Install deps + generate coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir --upgrade setuptools wheel
          pip install --no-cache-dir --no-build-isolation -r requirements.txt pytest pytest-cov pytest-mock cyclonedx-bom
          python3 -m pytest tests/ -q --cov=src --cov-report=xml:coverage.xml --cov-config=.coveragerc || true
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
      - name: Generate SBOM (resolved versions from installed env)
        run: cyclonedx-py environment --of json -o sbom.json
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -fsS -X POST "http://dependency-track.dependency-track.svc.cluster.local:8080/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "projectName=esef-data-fetcher" \
            -F "projectVersion=v$(git rev-parse --short HEAD)" \
            -F "autoCreate=true" \
            -F "bom=@sbom.json"

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Docker
        run: curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Build + push image
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build --network host -t gitea-http.dev-tools.svc.cluster.local:3000/fontem/esef-data-fetcher:$TAG .
          docker push gitea-http.dev-tools.svc.cluster.local:3000/fontem/esef-data-fetcher:$TAG
      - name: Sign image with Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry gitea-http.dev-tools.svc.cluster.local:3000/fontem/esef-data-fetcher:$TAG
          rm /tmp/cosign.key
