apiVersion: batch/v1
kind: CronJob
metadata:
  name: esef-data-fetcher
  namespace: gmr
  labels:
    app: esef-data-fetcher
spec:
  # Run every Sunday at 03:00 UTC (offset from EDGAR fetcher at 02:00)
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Allow up to 6 hours for a full fetch (~6,851 entities × 5 filings).
      activeDeadlineSeconds: 21600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: esef-data-fetcher
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: regcred
          containers:
            - name: esef-data-fetcher
              image: contribute.void42.internal/golden/esef-data-fetcher:{{ .Values.version }}
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "4"
                  memory: "2Gi"
              args:
                - "python"
                - "setup.py"
                - "--output-dir"
                - "/esef-output"
                - "--max-workers"
                - "8"
              volumeMounts:
                - name: esef-data
                  mountPath: /esef-output
          volumes:
            - name: esef-data
              persistentVolumeClaim:
                claimName: esef-data
